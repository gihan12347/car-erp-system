<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body>
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content import-board">
            <div class="import-hero">
                <div>
                    <p class="import-kicker">Fleet operations</p>
                    <h1>Registered vehicles</h1>
                    <p>Vehicle book, images, and previous owner. Finished vehicles continue in Preparation.</p>
                </div>
            </div>

            <p th:if="${notice}" class="alert alert-ok" th:text="${notice}"></p>
            <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>

            <form method="get" th:action="@{/registered}" class="import-toolbar">
                <label class="import-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"/>
                        <path d="M16 16.5 20 20.5"/>
                    </svg>
                    <input type="search" name="q" th:value="${searchQuery}"
                           placeholder="Search chassis, model, lot, or stock">
                </label>
                <button type="submit" class="import-tool">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"/>
                        <path d="M16 16.5 20 20.5"/>
                    </svg>
                    <span>Search</span>
                </button>
                <a th:if="${searchQuery != null and !#strings.isEmpty(searchQuery)}"
                   th:href="@{/registered}" class="import-tool is-quiet">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6l12 12M18 6 6 18"/>
                    </svg>
                    <span>Clear</span>
                </a>
            </form>

            <article class="panel import-panel">
                <div class="table-wrap is-fit" th:if="${rows != null and !rows.isEmpty()}">
                    <table class="pipeline-table is-flow is-import is-compact">
                        <thead>
                        <tr>
                            <th class="pipeline-vehicle-col">
                                <span class="import-th"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5 7 8h10l3 8.5"/><path d="M6 16.5h12"/><circle cx="8" cy="17.2" r="1.2"/><circle cx="16" cy="17.2" r="1.2"/></svg> Vehicle</span>
                            </th>
                            <th class="pipeline-chassis-col">
                                <span class="import-th"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h10"/></svg> Chassis</span>
                            </th>
                            <th>
                                <span class="import-th"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></svg> Pipeline</span>
                            </th>
                            <th class="pipeline-status-col">
                                <span class="import-th"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 8.5V12l2.5 2"/></svg> Status</span>
                            </th>
                            <th class="pipeline-actions-col">
                                <span class="import-th"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg> Actions</span>
                            </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${rows}"
                            th:with="bookHref=@{/workshop-yard/{c}/certificate(c=${row.vehicle.chassisNo})},
                                     photosHref=@{/registered/{c}/photos(c=${row.vehicle.chassisNo})},
                                     ownerHref=@{/registered/{c}/owner(c=${row.vehicle.chassisNo})},
                                     viewHref=${row.complete ? '/workshop-yard/' + #uris.escapePathSegment(row.vehicle.chassisNo) : (!row.bookReady ? '/workshop-yard/' + #uris.escapePathSegment(row.vehicle.chassisNo) + '/certificate' : (!row.photosReady ? '/registered/' + #uris.escapePathSegment(row.vehicle.chassisNo) + '/photos' : '/registered/' + #uris.escapePathSegment(row.vehicle.chassisNo) + '/owner'))}"
                            th:classappend="${row.complete} ? ' pipeline-row-complete' : ''">
                            <td class="pipeline-vehicle-cell">
                                <strong th:text="${row.vehicle.model != null ? row.vehicle.model : '—'}"
                                        th:title="${row.vehicle.model}">Toyota Aqua</strong>
                                <div class="muted" th:text="${row.vehicle.lotNo != null ? 'Lot ' + row.vehicle.lotNo : (row.vehicle.stockNo != null ? row.vehicle.stockNo : '')}">Lot 36497</div>
                            </td>
                            <td class="pipeline-chassis-cell">
                                <a th:replace="shared/chassis-link :: chassisLink(${row.vehicle.chassisNo})">TRJ250-0025161</a>
                            </td>
                            <td class="list-pipeline-cell">
                                <div class="list-pipeline"
                                     data-pipeline-flow
                                     th:classappend="${row.complete} ? ' is-complete' : ''"
                                     th:attr="data-completed=${(row.bookReady ? 1 : 0) + (row.photosReady ? 1 : 0) + (row.ownerReady ? 1 : 0)}">
                                    <ol class="list-pipeline-flow">
                                        <li th:classappend="${(row.bookSkipped ? ' is-skipped' : (row.bookFilled ? ' is-done' : ' is-current')) + (row.bookReady and row.photosReady ? ' is-linked' : '')}"
                                            style="--step:0">
                                            <a th:href="${bookHref}" class="list-pipeline-node"
                                               th:title="${row.bookSkipped} ? 'Vehicle book — skipped' : (row.bookFilled ? 'Vehicle book — complete' : 'Vehicle book — next')">
                                                <th:block th:replace="~{import-pipeline/fragments/stage-icon :: icon('book')}"></th:block>
                                            </a>
                                            <small>Book</small>
                                        </li>
                                        <li th:classappend="${(row.photosSkipped ? ' is-skipped' : (row.photosFilled ? ' is-done' : (!row.bookReady ? ' is-pending' : ' is-current'))) + (row.photosReady and row.ownerReady ? ' is-linked' : '')}"
                                            style="--step:1">
                                            <a th:href="${photosHref}" class="list-pipeline-node"
                                               th:title="${row.photosSkipped} ? 'Images — skipped' : (row.photosFilled ? 'Images — complete' : (${row.bookReady} ? 'Images — next' : 'Images — pending'))">
                                                <th:block th:replace="~{import-pipeline/fragments/stage-icon :: icon('photos')}"></th:block>
                                            </a>
                                            <small>Images</small>
                                        </li>
                                        <li th:classappend="${row.ownerSkipped} ? ' is-skipped' : (row.ownerFilled ? ' is-done' : (${row.photosReady} ? ' is-current' : ' is-pending'))"
                                            style="--step:2">
                                            <a th:href="${ownerHref}" class="list-pipeline-node"
                                               th:title="${row.ownerSkipped} ? 'Previous owner — skipped' : (row.ownerFilled ? 'Previous owner — complete' : (${row.photosReady} ? 'Previous owner — next' : 'Previous owner — pending'))">
                                                <th:block th:replace="~{import-pipeline/fragments/stage-icon :: icon('owner')}"></th:block>
                                            </a>
                                            <small>Owner</small>
                                        </li>
                                    </ol>
                                </div>
                            </td>
                            <td class="pipeline-status-cell">
                                <em th:if="${row.complete}" class="import-status is-forward">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12"/><path d="M13 7l5 5-5 5"/></svg>
                                    Preparation
                                </em>
                                <em th:unless="${row.complete}" class="import-status">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 8.5V12l2.2 2"/></svg>
                                    In progress
                                </em>
                            </td>
                            <td class="pipeline-actions-cell">
                                <div class="table-row-actions">
                                    <a th:href="${viewHref}" class="table-btn view">
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.4"/></svg>
                                        <span>View</span>
                                    </a>
                                    <div th:replace="shared/pipeline-delete :: pipelineDeleteBtn(
                                            @{/registered/{c}/delete(c=${row.vehicle.chassisNo})},
                                            'Delete this registered vehicle and all of its data? This cannot be undone.')"></div>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="import-empty" th:if="${rows == null or rows.isEmpty()}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h6.2A2.8 2.8 0 0 1 14 8.3V19a2.2 2.2 0 0 0-2.2-2.2H5z"/><path d="M19 5.5h-6.2A2.8 2.8 0 0 0 10 8.3V19a2.2 2.2 0 0 1 2.2-2.2H19z"/></svg>
                    <p>No registered vehicles yet.</p>
                </div>
            </article>
        </main>
    </div>
</div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
<script th:src="@{/js/shared/pipeline-scroll.js(v=20260905c)}"></script>
</body>
</html>
