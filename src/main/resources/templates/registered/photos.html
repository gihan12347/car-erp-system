<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body class="sheet-page import-form-page photos-page">
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1>Images</h1>
                    <p class="form-lead">Add up to five vehicle photos. These are stored with the same image records as the import pipeline.</p>
                </div>
                <div th:replace="shared/pipeline-delete :: pipelineDeleteBtn(
                        @{/registered/{c}/delete(c=${vehicle.chassisNo})},
                        'Delete this registered vehicle and all of its data? This cannot be undone.')"></div>
            </div>
            <div th:replace="registered/steps :: steps('photos', ${vehicle.chassisNo}, ${progress})"></div>
            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>
            <form th:action="@{/registered/{chassisNo}/photos(chassisNo=${vehicle.chassisNo})}"
                  method="post" class="vehicle-form" id="photosForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" id="chassisNo" th:value="${vehicle.chassisNo}">
                <article class="panel">
                    <div class="panel-head">
                        <h2>Vehicle images</h2>
                        <span class="photo-count" id="photoCountLabel" th:text="${photoCount + ' / ' + maxPhotos}">0 / 5</span>
                    </div>
                    <div class="photo-gallery" id="photoGallery" th:attr="data-max=${maxPhotos}, data-chassis=${vehicle.chassisNo}">
                        <div class="photo-card" th:each="photo : ${photos}"
                             th:attr="data-photo-id=${photo.id}, data-stored=${photo.storedName}">
                            <img th:src="@{/photos/documents/{name}(name=${photo.storedName})}" th:alt="${photo.originalName}">
                            <button type="button" class="photo-remove" title="Remove image">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        <label class="photo-add" id="photoAdd" th:classappend="${photosRemaining == 0} ? ' is-hidden'">
                            <input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp" multiple>
                            <i class="fa-solid fa-plus"></i>
                            <strong>Add image</strong>
                            <span>JPG, PNG, or WEBP</span>
                        </label>
                    </div>
                    <p class="upload-status" id="uploadStatus"></p>
                </article>
                <div class="import-view-actions">
                    <a class="panel-btn ghost import-form-submit" th:href="@{/workshop-yard/{c}/certificate(c=${vehicle.chassisNo})}">Back</a>
                    <button type="submit" class="panel-btn import-form-submit">Save and continue</button>
                    <button th:replace="import-pipeline/fragments/form-actions :: pipelineSkip('reg-photos', '/registered/')"></button>
                </div>
            </form>
        </main>
    </div>
</div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
<script th:src="@{/js/import-pipeline/photos.js(v=20260905b)}"></script>
</body>
</html>
