<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body class="sheet-page import-form-page jevic-page">
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1>Previous owner</h1>
                    <p class="form-lead">Upload the previous owner's identity card. Auto fill reads the name, NIC, address, and date of birth.</p>
                </div>
                <div th:replace="shared/pipeline-delete :: pipelineDeleteBtn(
                        @{/registered/{c}/delete(c=${vehicle.chassisNo})},
                        'Delete this registered vehicle and all of its data? This cannot be undone.')"></div>
            </div>
            <div th:replace="registered/steps :: steps('owner', ${vehicle.chassisNo}, ${progress})"></div>
            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>
            <form th:action="@{/registered/{chassisNo}/owner(chassisNo=${vehicle.chassisNo})}"
                  th:object="${owner}" method="post" class="vehicle-form clearance-form" id="registrationForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{ocrText}" id="ocrText">
                <input type="hidden" th:field="*{documentOriginalName}" id="documentOriginalName">
                <input type="hidden" th:field="*{documentStoredName}" id="documentStoredName">
                <input type="hidden" th:field="*{documentContentType}" id="documentContentType">
                <div class="sheet-layout preship-layout">
                    <div class="sheet-document-col">
                        <aside class="panel sheet-document" id="sheetPreview"
                               th:classappend="${owner.documentStoredName != null and !#strings.isEmpty(owner.documentStoredName)} ? ' has-file' : ''">
                            <div class="panel-head"><h2>Identity card</h2></div>
                            <div class="sheet-preview-frame" id="sheetPreviewFrame"
                                 th:with="hasDoc=${owner.documentStoredName != null and !#strings.isEmpty(owner.documentStoredName)},
                                          isPdf=${owner.documentStoredName != null and #strings.endsWith(owner.documentStoredName, '.pdf')}">
                                <div class="sheet-preview-empty" id="sheetPreviewEmpty" th:hidden="${hasDoc}">
                                    <i class="fa-solid fa-file-circle-plus"></i>
                                    <strong>No preview yet</strong>
                                    <span>Use <strong>Choose file</strong> to upload the identity card.</span>
                                </div>
                                <img id="sheetPreviewImage" alt="Identity card preview" th:hidden="${!hasDoc or isPdf}"
                                     th:src="${hasDoc and !isPdf} ? @{/registered/documents/{name}(name=${owner.documentStoredName})} : null">
                                <iframe id="sheetPreviewPdf" title="Identity card PDF" th:hidden="${!hasDoc or !isPdf}"
                                        th:src="${hasDoc and isPdf} ? @{/registered/documents/{name}(name=${owner.documentStoredName})} : null"></iframe>
                            </div>
                        </aside>
                        <div th:replace="shared/document-upload-toolbar :: documentUploadToolbar(
                                'Identity card', '', ${owner.documentOriginalName},
                                'Choose a JPG, PNG, or PDF identity card.', 'google-only')"></div>
                    </div>
                    <div class="sheet-fields preship-fields">
                        <article class="panel">
                            <div class="panel-head"><h2>Owner</h2></div>
                            <div class="field-grid">
                                <label>Full name<input type="text" th:field="*{fullName}" id="fullName"></label>
                                <label>NIC number<input type="text" th:field="*{nicNo}" id="nicNo"></label>
                                <label>Date of birth<input type="text" th:field="*{dateOfBirth}" id="dateOfBirth"></label>
                                <label>Gender<input type="text" th:field="*{gender}" id="gender"></label>
                                <label class="span-2">Address<textarea th:field="*{address}" id="address" rows="3"></textarea></label>
                            </div>
                            <div class="import-view-actions">
                                <a class="panel-btn ghost import-form-submit" th:href="@{/registered/{c}/photos(c=${vehicle.chassisNo})}">Back</a>
                                <button type="submit" class="panel-btn import-form-submit">Save and continue</button>
                                <button th:replace="import-pipeline/fragments/form-actions :: pipelineSkip('reg-owner', '/registered/')"></button>
                            </div>
                        </article>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>
<div id="sheetViewer" class="sheet-viewer" hidden>
    <div class="sheet-viewer-toolbar">
        <strong id="sheetViewerTitle">Identity card</strong>
        <div class="sheet-viewer-tools">
            <button type="button" class="panel-btn ghost" id="sheetViewerClose">Close</button>
        </div>
    </div>
    <div class="sheet-viewer-body" id="sheetViewerBody">
        <img id="sheetViewerImage" alt="Identity card">
        <iframe id="sheetViewerPdf" title="Identity card PDF" hidden></iframe>
    </div>
</div>
<div th:replace="shared/app-loader :: appLoader('fillLoader', 'Reading the identity card and filling fields...')"></div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
<script th:src="@{/js/shared/document-viewer.js(v=20260826d)}"></script>
<script th:src="@{/js/registered/owner.js(v=20261010a)}"></script>
</body>
</html>
