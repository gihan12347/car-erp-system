<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="importFormEquipment(record, continueTarget, hubMode)">
    <form th:action="@{/equipment/new}"
          th:object="${record}" method="post" class="vehicle-form equipment-form" id="equipmentForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="hub" th:value="${hubMode}">
        <input type="hidden" th:field="*{ocrText}" id="ocrText">
        <input type="hidden" th:field="*{documentOriginalName}" id="documentOriginalName">
        <input type="hidden" th:field="*{documentStoredName}" id="documentStoredName">
        <input type="hidden" th:field="*{documentContentType}" id="documentContentType">

        <div class="sheet-layout preship-layout">
            <div class="sheet-document-col">
            <aside class="panel sheet-document" id="sheetPreview"
                   th:classappend="${record.documentStoredName != null and !#strings.isEmpty(record.documentStoredName)} ? ' has-file' : ''">
                <div class="panel-head">
                    <h2>Document preview</h2>
                </div>

                <div class="sheet-preview-frame" id="sheetPreviewFrame"
                     th:with="hasDoc=${record.documentStoredName != null and !#strings.isEmpty(record.documentStoredName)},
                              isPdf=${record.documentStoredName != null and ((record.documentContentType != null and #strings.contains(record.documentContentType, 'pdf')) or #strings.endsWith(record.documentStoredName, '.pdf'))}">
                    <div class="sheet-preview-empty" id="sheetPreviewEmpty"
                         th:hidden="${hasDoc}">
                        <i class="fa-solid fa-file-circle-plus"></i>
                        <strong>No preview yet</strong>
                        <span>Use <strong>Choose file</strong> below to upload the inspection sheet.</span>
                    </div>
                    <img id="sheetPreviewImage"
                         alt="Equipment condition preview"
                         th:hidden="${!hasDoc or isPdf}"
                         th:src="${hasDoc and !isPdf} ? @{/equipment/documents/{name}(name=${record.documentStoredName})} : null">
                    <iframe id="sheetPreviewPdf"
                            title="Equipment condition PDF"
                            th:hidden="${!hasDoc or !isPdf}"
                            th:src="${hasDoc and isPdf} ? @{/equipment/documents/{name}(name=${record.documentStoredName})} : null"></iframe>
                </div>
            </aside>

            <div th:replace="fragments/document-upload-toolbar :: documentUploadToolbar(
                    'Inspection sheet',
                    '',
                    ${record.documentOriginalName},
                    'Choose a JPG, PNG, or PDF inspection sheet to upload and preview.',
                    'ocrspace')"></div>
            </div>

            <div class="sheet-fields preship-fields equipment-fields">
                <article class="panel">
                    <div class="panel-head"><h2>Vehicle</h2></div>
                    <div class="field-grid">
                        <label>Chassis number
                            <input type="text" th:field="*{chassisNo}" id="chassisNo" maxlength="40" required>
                        </label>
                        <div id="chassisDuplicateNotice" class="chassis-duplicate-notice alert-warn" hidden></div>
                    </div>
                </article>

                <article class="panel">
                    <div class="panel-head"><h2>Interior equipment</h2></div>
                    <div th:replace="fragments/equipment-field-grid :: equipmentFieldGrid(${interiorFields}, ${record}, 'edit')"></div>
                </article>

                <article class="panel">
                    <div class="panel-head"><h2>Exterior equipment</h2></div>
                    <div th:replace="fragments/equipment-field-grid :: equipmentFieldGrid(${exteriorFields}, ${record}, 'edit')"></div>
                    <div class="equipment-subgroup">
                        <h3>Body kit</h3>
                        <div th:replace="fragments/equipment-field-grid :: equipmentFieldGrid(${bodyKitFields}, ${record}, 'edit')"></div>
                    </div>
                    <div class="equipment-subgroup">
                        <h3>Truck body</h3>
                        <div th:replace="fragments/equipment-field-grid :: equipmentFieldGrid(${truckBodyFields}, ${record}, 'edit')"></div>
                    </div>
                </article>

                <article class="panel">
                    <div class="panel-head"><h2>Safety equipment</h2></div>
                    <div th:replace="fragments/equipment-field-grid :: equipmentFieldGrid(${safetyFields}, ${record}, 'edit')"></div>
                </article>

                <button type="submit" class="panel-btn import-form-submit"
                        th:text="${continueTarget != null and !#strings.isEmpty(continueTarget)}
                                ? |Save & continue · ${@pipelineStageService.title('IMPORT', continueTarget)}|
                                : 'Save & continue'">Save &amp; continue</button>
            </div>
        </div>
    </form>

    <div id="sheetViewer" class="sheet-viewer" hidden>
        <div class="sheet-viewer-toolbar">
            <strong id="sheetViewerTitle">Equipment condition</strong>
            <div class="sheet-viewer-tools">
                <button type="button" class="panel-btn ghost" id="sheetPrevEmptyField" title="Previous empty field">Prev</button>
                <button type="button" class="panel-btn ghost" id="sheetZoomOut" title="Zoom out">−</button>
                <button type="button" class="panel-btn ghost" id="sheetZoomIn" title="Zoom in">+</button>
                <button type="button" class="panel-btn ghost" id="sheetNextEmptyField" title="Next empty field">Next</button>
                <button type="button" class="panel-btn ghost" id="sheetViewerClose">Close</button>
            </div>
        </div>
        <div class="sheet-viewer-body" id="sheetViewerBody">
            <img id="sheetViewerImage" alt="Equipment condition document">
            <iframe id="sheetViewerPdf" title="Equipment condition PDF" hidden></iframe>
        </div>
    </div>

    <div id="fillLoader" class="fill-loader" hidden>
        <div class="fill-loader-card">
            <img th:src="@{/images/loading.svg}" alt="Loading" width="72" height="72">
            <p>Reading the inspection sheet and filling fields...</p>
        </div>
    </div>

    <script th:inline="javascript">
        window.EQUIPMENT_FIELD_ORDER = /*[[${equipmentFieldKeys}]]*/ [];
    </script>
    <script th:src="@{/js/app.js(v=20260829c)}"></script>
    <script th:src="@{/js/document-viewer.js(v=20260826d)}"></script>
    <script th:src="@{/js/equipment.js(v=20260829a)}"></script>
    <script th:src="@{/js/chassis-check.js(v=20260827a)}"></script>
</th:block>

</body>
</html>
