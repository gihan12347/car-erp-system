<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body>
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content import-board">
            <div class="import-hero">
                <div>
                    <p class="import-kicker">Fleet operations</p>
                    <h1>Import pipeline</h1>
                    <p>Follow each vehicle from the auction sheet through certificates, images, and the working sheet.</p>
                </div>
            </div>

            <p th:if="${notice}" class="alert alert-ok" th:text="${notice}"></p>
            <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>

            <form method="get" th:action="@{/import}" class="import-toolbar">
                <label class="import-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                        <circle cx="11" cy="11" r="6.5"/>
                        <path d="M16 16.5 20 20.5"/>
                    </svg>
                    <input type="search" name="q" th:value="${searchQuery}"
                           placeholder="Search chassis, model, lot, or stock">
                </label>
                <button type="submit" class="import-tool">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                        <circle cx="11" cy="11" r="6.5"/>
                        <path d="M16 16.5 20 20.5"/>
                    </svg>
                    <span>Search</span>
                </button>
                <a th:if="${searchQuery != null and !#strings.isEmpty(searchQuery)}"
                   th:href="@{/import}" class="import-tool is-quiet">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                        <path d="M6 6l12 12M18 6 6 18"/>
                    </svg>
                    <span>Clear</span>
                </a>
            </form>

            <article class="panel import-panel">
                <div class="table-wrap is-fit" th:if="${!rows.isEmpty()}">
                    <table class="pipeline-table is-flow is-import">
                        <thead>
                        <tr>
                            <th class="pipeline-vehicle-col">
                                <span class="import-th"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5 7 8h10l3 8.5"/><path d="M6 16.5h12"/><circle cx="8" cy="17.2" r="1.2"/><circle cx="16" cy="17.2" r="1.2"/></svg> Vehicle</span>
                            </th>
                            <th>
                                <span class="import-th"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></svg> Pipeline</span>
                            </th>
                            <th class="pipeline-status-col">
                                <span class="import-th"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 8.5V12l2.5 2"/></svg> Status</span>
                            </th>
                            <th class="pipeline-actions-col">
                                <span class="import-th"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg> Actions</span>
                            </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${rows}"
                            th:with="stages=${importStages != null ? importStages : @pipelineStageService.list('IMPORT')},
                                     keys=${importKeys != null ? importKeys : @pipelineStageService.keys('IMPORT')},
                                     pendingKey=${row.status.firstIncompleteStageKey(keys)}"
                            th:classappend="${row.status.pipelineCompleted} ? ' pipeline-row-complete' : ''">
                            <td class="pipeline-vehicle-cell">
                                <strong th:text="${row.vehicle.model != null ? row.vehicle.model : '—'}"
                                        th:title="${row.vehicle.model}">Toyota Land Cruiser</strong>
                                <a th:replace="shared/chassis-link :: chassisLink(${row.vehicle.chassisNo})">TRJ250-0025161</a>
                                <div class="muted" th:text="${row.vehicle.lotNo != null ? 'Lot ' + row.vehicle.lotNo : ''}">Lot 36497</div>
                            </td>
                            <td class="list-pipeline-cell">
                                <div class="list-pipeline"
                                     data-pipeline-flow
                                     th:classappend="${row.status.pipelineCompleted} ? ' is-complete' : ''"
                                     th:attr="data-completed=${row.status.completedCount}">
                                    <ol class="list-pipeline-flow">
                                        <li th:each="stage, iter : ${stages}"
                                            th:with="skipped=${row.status.isStageSkipped(stage.stageKey)},
                                                     ready=${!skipped and row.status.isStageComplete(stage.stageKey)},
                                                     nextSkipped=${!iter.last and row.status.isStageSkipped(stages[iter.count].stageKey)},
                                                     nextReady=${!iter.last and !nextSkipped and row.status.isStageComplete(stages[iter.count].stageKey)},
                                                     current=${!ready and !skipped and pendingKey == stage.stageKey},
                                                     editHref=${@pipelineStageService.editUrlFor(#uris.escapePathSegment(row.vehicle.chassisNo), stage.stageKey)},
                                                     shortTitle=${@pipelineStageService.shortTitleFor(stage.stageKey)}"
                                            th:classappend="${(skipped ? ' is-skipped' : (ready ? ' is-done' : (current ? ' is-current' : ' is-pending'))) + ((ready or skipped) and (nextReady or nextSkipped) ? ' is-linked' : '')}"
                                            th:style="'--step:' + ${iter.index}">
                                            <a th:if="${ready}"
                                               th:href="@{/auction/{c}(c=${row.vehicle.chassisNo}, stage=${stage.stageKey})}"
                                               class="list-pipeline-node"
                                               th:title="${stage.title + ' — complete'}">
                                                <th:block th:replace="~{import-pipeline/fragments/stage-icon :: icon(${stage.stageKey})}"></th:block>
                                            </a>
                                            <a th:if="${skipped}"
                                               th:href="@{/auction/{c}(c=${row.vehicle.chassisNo}, stage=${stage.stageKey})}"
                                               class="list-pipeline-node"
                                               th:title="${stage.title + ' — skipped'}">
                                                <th:block th:replace="~{import-pipeline/fragments/stage-icon :: icon(${stage.stageKey})}"></th:block>
                                            </a>
                                            <a th:if="${!ready and !skipped and editHref != null}"
                                               th:href="${editHref}"
                                               class="list-pipeline-node"
                                               th:title="${stage.title + (current ? ' — next' : ' — pending')}">
                                                <th:block th:replace="~{import-pipeline/fragments/stage-icon :: icon(${stage.stageKey})}"></th:block>
                                            </a>
                                            <span th:if="${!ready and !skipped and editHref == null}"
                                                  class="list-pipeline-node"
                                                  th:title="${stage.title + (current ? ' — next' : ' — pending')}">
                                                <th:block th:replace="~{import-pipeline/fragments/stage-icon :: icon(${stage.stageKey})}"></th:block>
                                            </span>
                                            <small th:text="${shortTitle != null ? shortTitle : stage.title}">Auction</small>
                                        </li>
                                    </ol>
                                </div>
                            </td>
                            <td class="pipeline-status-cell">
                                <em th:if="${row.status.pipelineCompleted}" class="import-status is-forward">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12"/><path d="M13 7l5 5-5 5"/></svg>
                                    Customs
                                </em>
                                <em th:unless="${row.status.pipelineCompleted}" class="import-status">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 8.5V12l2.2 2"/></svg>
                                    In import
                                </em>
                            </td>
                            <td class="pipeline-actions-cell">
                                <div class="table-row-actions">
                                    <a th:href="@{/auction/{c}(c=${row.vehicle.chassisNo})}" class="table-btn view">
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.4"/></svg>
                                        <span>View</span>
                                    </a>
                                    <form th:action="@{/import/{c}/delete(c=${row.vehicle.chassisNo})}" method="post" class="table-action-form"
                                          th:attr="onsubmit=|return confirm('Delete this vehicle and all later pipeline data? This cannot be undone.');|">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="table-btn delete" title="Delete">
                                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h14"/><path d="M9.5 7.5V5.8h5V7.5"/><path d="M8 7.5l.7 11h6.6l.7-11"/></svg>
                                            <span>Delete</span>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="import-empty" th:if="${rows.isEmpty()}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5 7 8h10l3 8.5"/><path d="M6 16.5h12"/><circle cx="8" cy="17.2" r="1.2"/><circle cx="16" cy="17.2" r="1.2"/></svg>
                    <p>No vehicles in the import pipeline.</p>
                </div>
            </article>
        </main>
    </div>
</div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
<script th:src="@{/js/shared/pipeline-scroll.js(v=20260905c)}"></script>
</body>
</html>
