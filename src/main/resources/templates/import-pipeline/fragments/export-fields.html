<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="exportFields" class="export-fields">
    <article class="panel">
        <div class="panel-head"><h2>Certificate</h2></div>
        <div class="field-grid">
            <label>Date of certificate <input type="date" th:field="*{issueDate}" id="issueDate"></label>
            <label>Export scheduled day <input type="date" th:field="*{exportScheduledDate}" id="exportScheduledDate"></label>
            <label class="span-2">Director General Land Transport Branch <input type="text" th:field="*{directorGeneralLandTransportBranch}" id="directorGeneralLandTransportBranch"></label>
        </div>
    </article>

    <article class="panel">
        <div class="panel-head"><h2>Registration</h2></div>
        <div class="field-grid">
            <label class="span-2">Motor vehicle registration no. <input type="text" th:field="*{registrationNo}" id="registrationNo"></label>
            <label>Registration date <input type="date" th:field="*{registrationDate}" id="registrationDate"></label>
            <label>First registration date <input type="month" th:field="*{firstRegDate}" id="firstRegDate"></label>
            <label>Specification no. <input type="text" th:field="*{specificationNo}" id="specificationNo"></label>
            <label>Classified no. <input type="text" th:field="*{classificationNo}" id="classificationNo"></label>
        </div>
    </article>

    <article class="panel">
        <div class="panel-head"><h2>Vehicle</h2></div>
        <div class="field-grid">
            <label>Chassis number <input type="text" th:field="*{chassisVin}" id="chassisVin"></label>
            <label>Type of vehicle <input type="text" th:field="*{vehicleClassification}" id="vehicleClassification"></label>
            <label>Form of vehicle <input type="text" th:field="*{bodyType}" id="bodyType"></label>
            <label>Usage <input type="text" th:field="*{useType}" id="useType"></label>
            <label>Private or commercial <input type="text" th:field="*{purpose}" id="purpose"></label>
            <label>Type of fuel <input type="text" th:field="*{fuelType}" id="fuelType"></label>
            <label>Displacement <input type="text" th:field="*{engineCapacity}" id="engineCapacity"></label>
        </div>
    </article>

    <article class="panel">
        <div class="panel-head"><h2>Specifications</h2></div>
        <div class="field-grid">
            <label>Seating capacity <input type="text" th:field="*{seatingCapacity}" id="seatingCapacity"></label>
            <label>Maximum carrying capacity <input type="text" th:field="*{maxCarry}" id="maxCarry"></label>
            <label>Weight of vehicle <input type="text" th:field="*{weightKg}" id="weightKg"></label>
            <label>Gross weight of vehicle <input type="text" th:field="*{grossWeightKg}" id="grossWeightKg"></label>
            <label>Length <input type="text" th:field="*{lengthCm}" id="lengthCm"></label>
            <label>Width <input type="text" th:field="*{widthCm}" id="widthCm"></label>
            <label>Height <input type="text" th:field="*{heightCm}" id="heightCm"></label>
            <label>Weight of front front axel <input type="text" th:field="*{frontAxleWeight}" id="frontAxleWeight"></label>
            <label>Weight of front rear axel <input type="text" th:field="*{frWeight}" id="frWeight"></label>
            <label>Weight of rear front axel <input type="text" th:field="*{rfWeight}" id="rfWeight"></label>
            <label>Weight of rear rear axel <input type="text" th:field="*{rearAxleWeight}" id="rearAxleWeight"></label>
        </div>
    </article>

    <article class="panel">
        <div class="panel-head"><h2>User and owner</h2></div>
        <div class="field-grid">
            <label class="span-2">Name of owner <input type="text" th:field="*{ownerName}" id="ownerName"></label>
            <label class="span-2">Address of owner <input type="text" th:field="*{ownerAddress}" id="ownerAddress"></label>
            <label class="span-2">Name of user <input type="text" th:field="*{userName}" id="userName"></label>
            <label class="span-2">Address of user <input type="text" th:field="*{userAddress}" id="userAddress"></label>
            <label class="span-2">Parking place <input type="text" th:field="*{localityOfUse}" id="localityOfUse"></label>
        </div>
    </article>
</div>

</body>
</html>
