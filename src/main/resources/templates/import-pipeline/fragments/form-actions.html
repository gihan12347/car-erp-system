<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Previous + Save actions for import stage edit forms (mirrors customs / preparation). -->
<div th:fragment="importFormActions(saveLabel, stageKey)" class="import-view-actions">
    <a th:if="${stageNav != null and stageNav.prevUrl != null}"
       th:href="${stageNav.prevUrl}"
       class="panel-btn ghost import-form-submit">
        <i class="fa-solid fa-chevron-left"></i>
        Previous
    </a>
    <button type="submit" class="panel-btn import-form-submit"
            th:text="${saveLabel != null and !#strings.isEmpty(saveLabel) ? saveLabel : 'Save & continue'}">
        Save &amp; continue
    </button>
    <button th:replace="import-pipeline/fragments/form-actions :: skipStageButton(${stageKey})"></button>
</div>

<button th:fragment="skipStageButton(stageKey)"
        type="submit"
        class="panel-btn ghost import-form-submit skip-stage-btn"
        formnovalidate="formnovalidate"
        formmethod="post"
        th:if="${stageKey != null and vehicle != null and vehicle.chassisNo != null and !#strings.isEmpty(vehicle.chassisNo) and !@importProgressService.isStageSatisfied(vehicle.chassisNo, stageKey)}"
        th:formaction="@{/import/{chassisNo}/skip(chassisNo=${vehicle.chassisNo}, stage=${stageKey})}">
    Skip
</button>

<th:block th:fragment="pipelineSkip(stageKey, actionPrefix)"
          th:with="skipChassis=${#ctx.containsVariable('vehicle') and vehicle != null and vehicle.chassisNo != null and !#strings.isEmpty(vehicle.chassisNo) ? vehicle.chassisNo : (#ctx.containsVariable('certificate') and certificate != null and certificate.chassisNo != null and !#strings.isEmpty(certificate.chassisNo) ? certificate.chassisNo : null)}">
    <button type="submit"
            class="panel-btn ghost import-form-submit skip-stage-btn"
            formnovalidate="formnovalidate"
            formmethod="post"
            th:if="${stageKey != null and skipChassis != null and !#strings.isEmpty(skipChassis) and @stageSkipSupport.canSkip(skipChassis, stageKey)}"
            th:formaction="@{${@skippedStageService.skipAction(skipChassis, stageKey, actionPrefix)}}">
        Skip
    </button>
</th:block>

</body>
</html>
