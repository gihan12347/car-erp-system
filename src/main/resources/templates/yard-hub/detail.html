<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body class="vehicle-summary-page">
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content">
            <a class="summary-back" th:href="@{/yards/{code}(code=${yard.bayCode})}">
                <i class="fa-solid fa-arrow-left"></i>
                <span th:text="${yard.yardName != null and !#strings.isEmpty(yard.yardName) ? yard.yardName : yard.bayCode}">Main yard</span>
            </a>

            <p th:if="${notice}" class="alert alert-ok" th:text="${notice}"></p>
            <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>

            <div th:replace="~{vehicle/summary :: summaryBody}"></div>

            <form th:action="@{/yards/{y}/{c}/move(y=${yard.bayCode}, c=${vehicle.chassisNo})}"
                  th:object="${record}" method="post" class="vehicle-form summary-move">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{chassisNo}">
                <input type="hidden" th:field="*{saleLocation}" id="saleLocationValue">

                <article class="panel">
                    <div class="panel-head"><h2>Move to available sale</h2></div>
                    <div class="field-grid">
                        <label>Date
                            <input type="date" th:field="*{listedOn}" required>
                        </label>
                        <label>Available sale
                            <select th:field="*{saleCode}" id="saleLocationSelect" required
                                    th:attr="data-current=*{saleCode}">
                                <option value="">Select sale…</option>
                                <option th:each="sale : ${saleLocations}"
                                        th:value="${sale.saleCode}"
                                        th:text="${sale.full
                                                ? sale.saleCode + ' · ' + sale.saleName + ' · full'
                                                : sale.saleCode + ' · ' + sale.saleName + ' · ' + sale.remaining + ' left'}"
                                        th:disabled="${sale.full}"
                                        th:attr="data-location=${sale.location},
                                                 data-remaining=${sale.remaining},
                                                 data-capacity=${sale.capacity},
                                                 data-occupied=${sale.occupied},
                                                 data-name=${sale.saleName}">SL-01 · Showroom · 12 left</option>
                            </select>
                        </label>
                        <label>Location
                            <input type="text" id="saleLocationDisplay" readonly class="readonly-field"
                                   th:value="${record.saleLocation}">
                        </label>
                        <label>Selling price
                            <span class="money-field">
                                <input type="text" th:field="*{askingPrice}" required
                                       inputmode="decimal" autocomplete="off" placeholder="0.00">
                                <span class="money-currency" aria-hidden="true">LKR</span>
                            </span>
                        </label>
                        <p class="yard-capacity-hint span-2" id="saleCapacityHint" hidden></p>
                    </div>
                </article>

                <div class="import-view-actions">
                    <a th:href="@{/yards/{code}(code=${yard.bayCode})}" class="panel-btn ghost import-form-submit">Back to yard</a>
                    <button type="submit" class="panel-btn import-form-submit">Move to sale</button>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="shared/document-viewer :: documentViewer"></div>
<script th:src="@{/js/shared/app.js(v=20261003s)}"></script>
<script th:src="@{/js/shared/document-viewer.js(v=20260826d)}"></script>
<script th:src="@{/js/vehicle/summary.js(v=20261003g)}"></script>
<script th:src="@{/js/shared/capacity-select.js(v=20260919a)}"></script>
<script>
    window.bindCapacitySelect({
        selectId: "saleLocationSelect",
        displayId: "saleLocationDisplay",
        valueId: "saleLocationValue",
        hintId: "saleCapacityHint"
    });
</script>
</body>
</html>
