<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body class="vehicle-summary-page">
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content">
            <a class="summary-back" th:href="@{/yards/{code}(code=${yard.bayCode})}">
                <i class="fa-solid fa-arrow-left"></i>
                <span th:text="${yard.yardName != null and !#strings.isEmpty(yard.yardName) ? yard.yardName : yard.bayCode}">Main yard</span>
            </a>

            <p th:if="${notice}" class="alert alert-ok" th:text="${notice}"></p>
            <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>

            <div th:replace="~{vehicle/summary :: summaryBody}"></div>

            <form th:action="@{/yards/{y}/{c}/move(y=${yard.bayCode}, c=${vehicle.chassisNo})}"
                  th:object="${record}" method="post" class="vehicle-form summary-move">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{chassisNo}">
                <input type="hidden" th:field="*{saleLocation}" id="saleLocationValue">

                <article class="panel">
                    <div class="panel-head"><h2>Move to available sale</h2></div>
                    <div class="field-grid">
                        <label>Date
                            <input type="date" th:field="*{listedOn}" required>
                        </label>
                        <label>Available sale
                            <select th:field="*{saleCode}" id="saleLocationSelect" required
                                    th:attr="data-current=*{saleCode}">
                                <option value="">Select sale…</option>
                                <option th:each="sale : ${saleLocations}"
                                        th:value="${sale.saleCode}"
                                        th:text="${sale.full
                                                ? sale.saleCode + ' · ' + sale.saleName + ' · full'
                                                : sale.saleCode + ' · ' + sale.saleName + ' · ' + sale.remaining + ' left'}"
                                        th:disabled="${sale.full}"
                                        th:attr="data-location=${sale.location},
                                                 data-remaining=${sale.remaining},
                                                 data-capacity=${sale.capacity},
                                                 data-occupied=${sale.occupied},
                                                 data-name=${sale.saleName}">SL-01 · Showroom · 12 left</option>
                            </select>
                        </label>
                        <label>Location
                            <input type="text" id="saleLocationDisplay" readonly required class="readonly-field"
                                   th:value="${record.saleLocation}">
                        </label>
                        <label>Selling price
                            <span class="money-field">
                                <input type="text" th:field="*{askingPrice}" required
                                       inputmode="decimal" autocomplete="off" placeholder="0.00">
                                <span class="money-currency" aria-hidden="true">LKR</span>
                            </span>
                        </label>
                        <p class="yard-capacity-hint span-2" id="saleCapacityHint" hidden></p>
                    </div>
                </article>

                <div class="import-view-actions">
                    <a th:href="@{/yards/{code}(code=${yard.bayCode})}" class="panel-btn ghost import-form-submit">Back to yard</a>
                    <button type="submit" id="moveToSaleBtn" class="panel-btn import-form-submit"
                            th:disabled="${#strings.isEmpty(record.listedOn) or #strings.isEmpty(record.saleCode) or #strings.isEmpty(record.saleLocation) or #strings.isEmpty(record.askingPrice)}">Move to sale</button>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="shared/document-viewer :: documentViewer"></div>
<script th:src="@{/js/shared/app.js(v=20261003s)}"></script>
<script th:src="@{/js/shared/document-viewer.js(v=20260826d)}"></script>
<script th:src="@{/js/vehicle/summary.js(v=20261003g)}"></script>
<script th:src="@{/js/shared/capacity-select.js(v=20260919a)}"></script>
<script>
    window.bindCapacitySelect({
        selectId: "saleLocationSelect",
        displayId: "saleLocationDisplay",
        valueId: "saleLocationValue",
        hintId: "saleCapacityHint"
    });

    (function () {
        var form = document.querySelector(".summary-move");
        var button = document.getElementById("moveToSaleBtn");
        if (!form || !button) {
            return;
        }
        var date = form.querySelector("[name='listedOn']");
        var sale = document.getElementById("saleLocationSelect");
        var location = document.getElementById("saleLocationValue");
        var price = form.querySelector("[name='askingPrice']");

        function text(el) {
            return el ? String(el.value || "").trim() : "";
        }

        function formatPrice(raw) {
            var cleaned = String(raw || "").replace(/,/g, "").replace(/[^\d.]/g, "");
            if (!cleaned) {
                return "";
            }
            var dot = cleaned.indexOf(".");
            var whole = dot === -1 ? cleaned : cleaned.slice(0, dot);
            var fraction = dot === -1 ? null : cleaned.slice(dot + 1).replace(/\./g, "").slice(0, 2);
            whole = whole.replace(/^0+(?=\d)/, "");
            if (!whole) {
                whole = fraction === null ? "" : "0";
            }
            var grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            if (fraction === null) {
                return grouped;
            }
            return grouped + "." + fraction;
        }

        function caretAfterDigits(formatted, count) {
            if (count <= 0) {
                return 0;
            }
            var seen = 0;
            var i;
            for (i = 0; i < formatted.length; i++) {
                var ch = formatted.charAt(i);
                if ((ch >= "0" && ch <= "9") || ch === ".") {
                    seen++;
                    if (seen >= count) {
                        return i + 1;
                    }
                }
            }
            return formatted.length;
        }

        function priceReady() {
            var raw = text(price).replace(/,/g, "");
            if (!raw || raw === ".") {
                return false;
            }
            var amount = Number(raw);
            return isFinite(amount) && amount > 0;
        }

        if (price) {
            price.addEventListener("input", function () {
                var start = price.selectionStart || 0;
                var before = price.value.slice(0, start).replace(/[^\d.]/g, "").length;
                var formatted = formatPrice(price.value);
                if (price.value !== formatted) {
                    price.value = formatted;
                    var next = caretAfterDigits(formatted, before);
                    price.setSelectionRange(next, next);
                }
            });
            if (price.value) {
                price.value = formatPrice(price.value);
            }
        }

        function sync() {
            button.disabled = !(text(date) && text(sale) && text(location) && priceReady());
        }

        form.addEventListener("input", sync);
        form.addEventListener("change", sync);
        sync();
    })();
</script>
</body>
</html>
