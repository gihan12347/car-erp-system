<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<form th:fragment="pipelineDeleteBtn(actionUrl, confirmMessage)"
      th:action="${actionUrl}" method="post" class="table-action-form"
      th:attr="onsubmit=|return confirm('${confirmMessage}');|">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit" class="table-btn delete" title="Delete">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h14"/><path d="M9.5 7.5V5.8h5V7.5"/><path d="M8 7.5l.7 11h6.6l.7-11"/></svg>
        <span>Delete</span>
    </button>
</form>

</body>
</html>
