<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body>
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content reports-hub">
            <p class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}">Choose a report.</p>

            <div class="fleet-shell">
                <header class="fleet-head">
                    <div>
                        <p class="eyebrow">Reporting</p>
                        <h1>Generate reports</h1>
                        <p>Choose a report, set the period, then generate a printable register. Export CSV for Excel.</p>
                    </div>
                </header>

                <form method="get" th:action="@{/reports/run}" class="report-generator" id="reportGenerator">
                    <label class="report-generator-report">
                        <span>Report</span>
                        <select name="kind" required>
                            <option value="">Select a report</option>
                            <option th:each="card : ${catalog}"
                                    th:value="${card.kind}"
                                    th:text="${card.group + ' — ' + card.title}">Stock book</option>
                        </select>
                    </label>
                    <label class="report-generator-date">
                        <span>From</span>
                        <input type="date" class="native-date" name="from" th:value="${fromDate}">
                    </label>
                    <label class="report-generator-date">
                        <span>To</span>
                        <input type="date" class="native-date" name="to" th:value="${toDate}">
                    </label>
                    <label class="report-generator-search">
                        <span>Search</span>
                        <input type="search" name="q" th:value="${searchQuery}"
                               placeholder="Chassis, stock no, make, or buyer">
                    </label>
                    <button type="submit" class="import-tool">
                        <i class="fa-solid fa-play" aria-hidden="true"></i>
                        <span>Generate</span>
                    </button>
                </form>

                <div class="report-catalog">
                    <article class="report-card" th:each="card : ${catalog}" th:classappend="${card.tone}">
                        <p class="report-card-section" th:text="${card.group}">Inventory</p>
                        <span class="report-card-icon" aria-hidden="true">
                            <i class="fa-solid" th:classappend="${card.icon}"></i>
                        </span>
                        <div class="report-card-copy">
                            <strong th:text="${card.title}">Stock book</strong>
                            <em th:text="${card.standard}">IAS 2 inventory listing</em>
                            <span th:text="${card.description}">On-hand inventory.</span>
                        </div>
                        <div class="report-card-metric">
                            <b th:text="${card.metric}">0</b>
                            <em th:text="${card.metricLabel}">on hand</em>
                            <small th:text="${card.extra}">—</small>
                        </div>
                        <a class="import-tool"
                           th:href="@{/reports/{kind}(kind=${card.kind}, q=${searchQuery}, from=${fromDate}, to=${toDate})}">
                            Generate
                        </a>
                    </article>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
</body>
</html>
