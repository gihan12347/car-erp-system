<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head(${pageTitle})"></head>
<body class="prep-page">
<div class="app-shell">
    <aside th:replace="fragments/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="fragments/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1 th:text="${'Step ' + @pipelineStageService.displayNumber('PREP', 'inspection') + ' · Inspection'}">Step 1 · Inspection</h1>
                    <p class="form-lead">Fill every item. Selecting <strong>No</strong> creates a workshop job immediately. Save stays off until all fields are filled.</p>
                </div>
            </div>

            <div th:replace="fragments/prep-pipeline :: prepPipelineSteps(
                    'inspection',
                    ${vehicle.chassisNo},
                    ${workshopReady},
                    ${yardReady},
                    ${inspectionReady},
                    ${canEnterYard},
                    ${vehicle.model},
                    false)"></div>

            <p id="inspectionJobStatus" class="alert alert-ok" hidden></p>
            <p id="inspectionJobError" class="alert alert-error" hidden></p>
            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>

            <form th:action="@{/inspection/{chassisNo}(chassisNo=${vehicle.chassisNo})}"
                  th:object="${record}" method="post" class="vehicle-form prep-form" id="inspectionForm"
                  th:attr="data-chassis=${vehicle.chassisNo}, data-fail-url=@{/inspection/{c}/fail-item(c=${vehicle.chassisNo})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{chassisNo}">

                <label class="complete-check panel">
                    <input type="checkbox" th:field="*{completed}" id="inspectionCompleted">
                    <span>
                        <strong>Mark inspection complete</strong>
                        <small>Available after every item has a result.</small>
                    </span>
                </label>

                <article class="panel">
                    <div class="panel-head"><h2>Inspection details</h2></div>
                    <div class="field-grid">
                        <label>Inspector
                            <input type="text" th:field="*{inspector}" id="inspector" placeholder="Name" required>
                        </label>
                        <label>Inspection date
                            <input type="text" th:field="*{inspectionDate}" id="inspectionDate" placeholder="2026-08-30" required>
                        </label>
                        <label class="span-2">Notes
                            <textarea th:field="*{notes}" rows="2" placeholder="Overall condition, follow-up..."></textarea>
                        </label>
                    </div>
                </article>

                <div id="inspectionItemList">
                    <article class="panel inspection-item-card" th:each="line, stat : *{lines}"
                             th:data-index="${stat.index}"
                             th:classappend="${line.catalogItem} ? ' is-catalog' : ' is-custom'">
                        <div class="panel-head workshop-job-head">
                            <h2>
                                <span class="inspection-item-title" th:if="${line.catalogItem}" th:text="${line.itemTitle}">Engine</span>
                                <span th:unless="${line.catalogItem}">
                                    Item <span class="inspection-item-num" th:text="${stat.count}">1</span>
                                </span>
                            </h2>
                            <button type="button" class="panel-btn ghost workshop-job-remove inspection-item-remove"
                                    th:unless="${line.catalogItem}">Remove</button>
                        </div>
                        <input type="hidden" th:if="${line.id != null}" th:field="*{lines[__${stat.index}__].id}">
                        <input type="hidden" th:field="*{lines[__${stat.index}__].itemKey}">
                        <input type="hidden" th:field="*{lines[__${stat.index}__].catalogItem}">
                        <input type="hidden" th:field="*{lines[__${stat.index}__].sortOrder}">
                        <input type="hidden" th:if="${line.catalogItem}" th:field="*{lines[__${stat.index}__].itemTitle}">
                        <div class="field-grid">
                            <label class="span-2" th:unless="${line.catalogItem}">Item
                                <input type="text" class="inspection-item-title-input" th:field="*{lines[__${stat.index}__].itemTitle}"
                                       placeholder="e.g. Windscreen chip">
                            </label>
                            <div class="span-2 inspection-result-field">
                                <span class="inspection-result-label">Result</span>
                                <div class="equipment-radio-group inspection-radio-group" role="radiogroup"
                                     th:attr="aria-label=${line.itemTitle}">
                                    <label class="equipment-radio"
                                           th:each="opt : ${resultOptions}"
                                           th:classappend="${' result-' + T(com.carsale.erp.service.InspectionResults).cssClass(opt)}"
                                           th:for="${T(com.carsale.erp.service.InspectionResults).choiceDomId('line', stat.index, opt)}">
                                        <input type="radio"
                                               th:id="${T(com.carsale.erp.service.InspectionResults).choiceDomId('line', stat.index, opt)}"
                                               th:field="*{lines[__${stat.index}__].result}"
                                               th:value="${opt}">
                                        <span th:text="${T(com.carsale.erp.service.InspectionResults).display(opt)}">OK</span>
                                    </label>
                                </div>
                                <p class="inspection-job-note muted" hidden></p>
                            </div>
                            <label class="span-2">Notes
                                <textarea th:field="*{lines[__${stat.index}__].notes}" rows="2"
                                          placeholder="Required work if No..."></textarea>
                            </label>
                        </div>
                    </article>
                </div>

                <button type="button" class="panel-btn ghost workshop-add-job" id="addInspectionItem">
                    <i class="fa-solid fa-plus"></i>
                    Add inspection item
                </button>

                <div class="import-view-actions">
                    <button type="submit" class="panel-btn import-form-submit" id="saveInspectionBtn" disabled>
                        Save inspection
                    </button>
                    <a th:if="${stageNav != null and stageNav.nextUrl != null}"
                       th:href="${stageNav.nextUrl}"
                       class="panel-btn ghost import-form-submit">
                        <span th:text="${stageNav.nextLabel}">Next · Workshop</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </a>
                </div>
            </form>
        </main>
    </div>
</div>

<template id="inspectionItemTemplate">
    <article class="panel inspection-item-card is-custom" data-index="__idx__">
        <div class="panel-head workshop-job-head">
            <h2>Item <span class="inspection-item-num">__num__</span></h2>
            <button type="button" class="panel-btn ghost workshop-job-remove inspection-item-remove">Remove</button>
        </div>
        <input type="hidden" name="lines[__idx__].itemKey" value="">
        <input type="hidden" name="lines[__idx__].catalogItem" value="false">
        <input type="hidden" name="lines[__idx__].sortOrder" value="__idx__">
        <div class="field-grid">
            <label class="span-2">Item
                <input type="text" class="inspection-item-title-input" name="lines[__idx__].itemTitle" placeholder="e.g. Windscreen chip">
            </label>
            <div class="span-2 inspection-result-field">
                <span class="inspection-result-label">Result</span>
                <div class="equipment-radio-group inspection-radio-group" role="radiogroup" aria-label="Inspection result">
                    <label class="equipment-radio result-OK" for="line__idx___OK">
                        <input type="radio" id="line__idx___OK" name="lines[__idx__].result" value="OK">
                        <span>OK</span>
                    </label>
                    <label class="equipment-radio result-NO" for="line__idx___NO">
                        <input type="radio" id="line__idx___NO" name="lines[__idx__].result" value="NO">
                        <span>No</span>
                    </label>
                    <label class="equipment-radio result-NA" for="line__idx___NA">
                        <input type="radio" id="line__idx___NA" name="lines[__idx__].result" value="N/A">
                        <span>N/A</span>
                    </label>
                </div>
                <p class="inspection-job-note muted" hidden></p>
            </div>
            <label class="span-2">Notes
                <textarea name="lines[__idx__].notes" rows="2" placeholder="Required work if No..."></textarea>
            </label>
        </div>
    </article>
</template>

<script th:src="@{/js/app.js(v=20260829c)}"></script>
<script th:src="@{/js/inspection.js(v=20260830b)}"></script>
</body>
</html>
