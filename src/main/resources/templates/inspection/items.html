<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head(${pageTitle})"></head>
<body>
<div class="app-shell">
    <aside th:replace="fragments/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="fragments/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1>Inspection items</h1>
                    <p class="form-lead">These items appear automatically on every vehicle inspection in the preparation pipeline. Marking <strong>No</strong> creates a workshop job.</p>
                </div>
            </div>

            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>

            <section class="inspection-settings">
                <article class="panel">
                    <div class="panel-head"><h2>Add inspection item</h2></div>
                    <form method="post" th:action="@{/inspection-items}" class="inspection-add-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label>Item name
                            <input type="text" name="title" required maxlength="160" placeholder="e.g. Windscreen">
                        </label>
                        <button type="submit" class="panel-btn">Add item</button>
                    </form>
                </article>

                <article class="panel">
                    <div class="panel-head"><h2>Inspection checklist</h2></div>
                    <div class="table-wrap" th:if="${inspectionItems != null and !inspectionItems.isEmpty()}">
                        <table class="pipeline-table">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Item</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item, stat : ${inspectionItems}">
                                <td th:text="${stat.count}">1</td>
                                <td>
                                    <form method="post" th:action="@{/inspection-items/{id}(id=${item.id})}"
                                          class="inspection-edit-form">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="text" name="title" th:value="${item.title}" required maxlength="160">
                                        <button type="submit" class="table-btn edit">Save</button>
                                    </form>
                                </td>
                                <td>
                                    <form method="post" th:action="@{/inspection-items/{id}/delete(id=${item.id})}"
                                          class="table-action-form"
                                          onsubmit="return confirm('Remove this inspection item? Existing vehicle results are kept.');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="table-btn delete">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <p class="muted" th:if="${inspectionItems == null or inspectionItems.isEmpty()}">
                        No inspection items yet. Add the checks you want to see on every vehicle.
                    </p>
                </article>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js(v=20260829c)}"></script>
</body>
</html>
