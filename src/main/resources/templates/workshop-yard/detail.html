<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head(${pageTitle})"></head>
<body class="prep-page">
<div class="app-shell">
    <aside th:replace="fragments/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="fragments/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1 th:if="${stageKey == 'inspection'}">Inspection</h1>
                    <h1 th:if="${stageKey == 'workshop'}">Workshop</h1>
                    <h1 th:if="${stageKey == 'yard'}">Yard</h1>
                    <p class="form-lead" th:if="${stageKey == 'inspection'}">Review checklist results. Marking No creates a workshop job.</p>
                    <p class="form-lead" th:if="${stageKey == 'workshop'}">Review repair work, parts, and workshop completion.</p>
                    <p class="form-lead" th:if="${stageKey == 'yard'}">Review bay allocation, keys, and yard inspection.</p>
                </div>
                <div th:replace="fragments/pipeline-delete :: pipelineDeleteBtn(
                        @{/workshop-yard/{c}/delete(c=${vehicle.chassisNo})},
                        'Delete preparation data? Ready-for-sale data will also be deleted.')"></div>
            </div>

            <div th:replace="fragments/prep-pipeline :: prepPipelineSteps(
                    ${stageKey},
                    ${vehicle.chassisNo},
                    ${workshopReady},
                    ${yardReady},
                    ${inspectionReady},
                    ${canEnterYard},
                    ${vehicle.model},
                    true)"></div>

            <div class="vehicle-form" th:if="${stageKey == 'inspection'}">
                <div th:replace="fragments/inspection-view :: inspectionView(${vehicle}, ${inspection}, ${inspectionReady})"></div>
            </div>
            <div class="vehicle-form" th:if="${stageKey == 'workshop'}">
                <div th:replace="fragments/workshop-view :: workshopView(${vehicle}, ${workshop}, ${workshopReady})"></div>
            </div>
            <div class="vehicle-form" th:if="${stageKey == 'yard'}">
                <div th:replace="fragments/yard-view :: yardView(${vehicle}, ${yard}, ${yardReady})"></div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js(v=20260829c)}"></script>
</body>
</html>
