<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head(${pageTitle})"></head>
<body class="prep-page">
<div class="app-shell">
    <aside th:replace="fragments/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="fragments/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1 th:text="${'Step ' + @pipelineStageService.displayNumber('PREP', 'workshop') + ' · Workshop'}">Step 1 · Workshop</h1>
                    <p class="form-lead">Add every repair job for this vehicle. Mark workshop complete when all work is done.</p>
                </div>
            </div>

            <div th:replace="fragments/prep-pipeline :: prepPipelineSteps(
                    'workshop',
                    ${vehicle.chassisNo},
                    ${workshopReady},
                    ${yardReady},
                    ${inspectionReady},
                    ${canEnterYard},
                    ${vehicle.model},
                    false)"></div>

            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>

            <form th:action="@{/workshop/{chassisNo}(chassisNo=${vehicle.chassisNo})}"
                  th:object="${record}" method="post" class="vehicle-form prep-form" id="workshopForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{chassisNo}">

                <label class="complete-check panel">
                    <input type="checkbox" th:field="*{completed}">
                    <span>
                        <strong>Mark workshop complete</strong>
                        <small>This step is done. Yard stays locked until every job status is Complete.</small>
                    </span>
                </label>

                <div id="workshopJobList">
                    <article class="panel workshop-job-card" th:each="line, stat : *{lines}" th:data-index="${stat.index}">
                        <div class="panel-head workshop-job-head">
                            <h2>
                                Job <span class="workshop-job-num" th:text="${stat.count}">1</span>
                                <em class="pill rust inspection-job-pill"
                                    th:if="${line.inspectionItemKey != null and !#strings.isEmpty(line.inspectionItemKey)}">From inspection</em>
                            </h2>
                            <button type="button" class="panel-btn ghost workshop-job-remove">Remove</button>
                        </div>
                        <input type="hidden" th:if="${line.id != null}" th:field="*{lines[__${stat.index}__].id}">
                        <input type="hidden" th:field="*{lines[__${stat.index}__].inspectionItemKey}">
                        <div class="field-grid">
                            <label>Status
                                <select th:field="*{lines[__${stat.index}__].jobStatus}">
                                    <option value="PENDING">Not started</option>
                                    <option value="IN_PROGRESS">In progress</option>
                                    <option value="COMPLETE">Complete</option>
                                </select>
                            </label>
                            <label>Technician
                                <input type="text" th:field="*{lines[__${stat.index}__].technician}" placeholder="Name">
                            </label>
                            <label class="span-2">Job summary
                                <input type="text" th:field="*{lines[__${stat.index}__].jobSummary}"
                                       placeholder="e.g. Polish, minor dent, service">
                            </label>
                            <label>Started on
                                <input type="text" th:field="*{lines[__${stat.index}__].startedOn}" placeholder="2026-08-20">
                            </label>
                            <label>Completed on
                                <input type="text" th:field="*{lines[__${stat.index}__].completedOn}" placeholder="2026-08-23">
                            </label>
                            <label>Labour hours
                                <input type="text" th:field="*{lines[__${stat.index}__].laborHours}">
                            </label>
                            <label>Estimated cost
                                <input type="text" th:field="*{lines[__${stat.index}__].estimatedCost}" placeholder="Rs.">
                            </label>
                            <label>Actual cost
                                <input type="text" th:field="*{lines[__${stat.index}__].actualCost}" placeholder="Rs.">
                            </label>
                            <label class="span-2">Parts used
                                <textarea th:field="*{lines[__${stat.index}__].partsUsed}" rows="2"
                                          placeholder="Filters, pads, bulbs..."></textarea>
                            </label>
                            <label class="span-2">Notes
                                <textarea th:field="*{lines[__${stat.index}__].notes}" rows="2"></textarea>
                            </label>
                        </div>
                    </article>
                </div>

                <button type="button" class="panel-btn ghost workshop-add-job" id="addWorkshopJob">
                    <i class="fa-solid fa-plus"></i>
                    Add job
                </button>

                <div class="import-view-actions">
                    <a th:if="${stageNav != null and stageNav.prevUrl != null}"
                       th:href="${stageNav.prevUrl}"
                       class="panel-btn ghost import-form-submit">
                        <i class="fa-solid fa-chevron-left"></i>
                        Previous · Inspection
                    </a>
                    <button type="submit" class="panel-btn import-form-submit">Save workshop jobs</button>
                    <a th:if="${canEnterYard and stageNav != null and stageNav.nextUrl != null}"
                       th:href="${stageNav.nextUrl}"
                       class="panel-btn ghost import-form-submit">
                        <span th:text="${stageNav.nextLabel}">Next · Yard</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </a>
                    <span th:unless="${canEnterYard}"
                          class="panel-btn ghost import-form-submit is-disabled"
                          aria-disabled="true"
                          title="Finish every workshop job first">
                        Complete all jobs to open Yard
                    </span>
                </div>
            </form>
        </main>
    </div>
</div>

<template id="workshopJobTemplate">
    <article class="panel workshop-job-card" data-index="__idx__">
        <div class="panel-head workshop-job-head">
            <h2>Job <span class="workshop-job-num">__num__</span></h2>
            <button type="button" class="panel-btn ghost workshop-job-remove">Remove</button>
        </div>
        <div class="field-grid">
            <label>Status
                <select name="lines[__idx__].jobStatus">
                    <option value="PENDING">Not started</option>
                    <option value="IN_PROGRESS">In progress</option>
                    <option value="COMPLETE">Complete</option>
                </select>
            </label>
            <label>Technician
                <input type="text" name="lines[__idx__].technician" placeholder="Name">
            </label>
            <label class="span-2">Job summary
                <input type="text" name="lines[__idx__].jobSummary" placeholder="e.g. Polish, minor dent, service">
            </label>
            <label>Started on
                <input type="text" name="lines[__idx__].startedOn" placeholder="2026-08-20">
            </label>
            <label>Completed on
                <input type="text" name="lines[__idx__].completedOn" placeholder="2026-08-23">
            </label>
            <label>Labour hours
                <input type="text" name="lines[__idx__].laborHours">
            </label>
            <label>Estimated cost
                <input type="text" name="lines[__idx__].estimatedCost" placeholder="Rs.">
            </label>
            <label>Actual cost
                <input type="text" name="lines[__idx__].actualCost" placeholder="Rs.">
            </label>
            <label class="span-2">Parts used
                <textarea name="lines[__idx__].partsUsed" rows="2" placeholder="Filters, pads, bulbs..."></textarea>
            </label>
            <label class="span-2">Notes
                <textarea name="lines[__idx__].notes" rows="2"></textarea>
            </label>
        </div>
    </article>
</template>

<script th:src="@{/js/app.js(v=20260829c)}"></script>
<script th:src="@{/js/workshop.js(v=20260823a)}"></script>
</body>
</html>
