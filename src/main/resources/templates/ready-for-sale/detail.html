<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body class="sheet-page import-form-page import-view-page">
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content">
            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>

            <div class="dash-head">
                <div>
                    <h1 th:if="${stageKey == 'details'}"
                        th:text="${@pipelineStageService.title('READY', 'details')}">Details</h1>
                    <h1 th:if="${stageKey == 'listing'}"
                        th:text="${@pipelineStageService.title('READY', 'listing')}">Listing</h1>
                    <h1 th:if="${stageKey == 'registration'}"
                        th:text="${@pipelineStageService.title('READY', 'registration')}">Registration</h1>
                    <p class="form-lead" th:if="${stageKey == 'details'}">Vehicle profile with photos and essential specifications. This step is complete when the vehicle enters the sale pipeline.</p>
                    <p class="form-lead" th:if="${stageKey == 'listing'}">Review the sale date, location, pricing, and listing status.</p>
                    <p class="form-lead" th:if="${stageKey == 'registration'}">Local plate number, owner, RMV date, and license details.</p>
                </div>
                <div th:replace="shared/pipeline-delete :: pipelineDeleteBtn(
                        @{/ready-for-sale/{c}/delete(c=${vehicle.chassisNo})},
                        'Delete this sale listing?')"></div>
            </div>

            <div th:replace="ready-for-sale/fragments/pipeline :: salePipelineSteps(
                    ${stageKey},
                    ${vehicle.chassisNo},
                    ${listingReady},
                    ${vehicle.model},
                    true,
                    ${detailsReady},
                    ${registrationReady})"></div>

            <div class="vehicle-form" th:if="${stageKey == 'details'}">
                <div th:replace="ready-for-sale/fragments/view-details :: detailsView(${vehicle}, ${photos})"></div>
            </div>
            <div class="vehicle-form" th:if="${stageKey == 'listing'}">
                <div th:replace="ready-for-sale/fragments/view-listing :: listingView(${vehicle}, ${listing}, ${listingReady})"></div>
            </div>
            <div class="vehicle-form" th:if="${stageKey == 'registration'}">
                <div th:replace="ready-for-sale/fragments/view-registration :: registrationView(${vehicle}, ${registration}, ${registrationReady})"></div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
</body>
</html>
