<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body>
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content pipeline-page">
            <div class="dash-head">
                <div>
                    <h1>Sale</h1>
                    <p class="form-lead">Open an available sale to see vehicles assigned there.</p>
                </div>
            </div>

            <p th:if="${notice}" class="alert alert-ok" th:text="${notice}"></p>
            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>

            <p class="place-summary"
               th:if="${groups != null and !groups.isEmpty()}"
               th:with="used=${#aggregates.sum(groups.![vehicleCount])}">
                <span><strong th:text="${#lists.size(groups)}">4</strong> sale locations</span>
                <span>
                    <strong th:text="${used}">0</strong>
                    <th:block th:text="${used == 1} ? 'vehicle' : 'vehicles'">vehicles</th:block>
                </span>
            </p>

            <section class="place-grid" th:if="${groups != null and !groups.isEmpty()}">
                <a class="place-card"
                   th:each="group : ${groups}"
                   th:href="@{/ready-for-sale/{code}(code=${group.saleCode})}"
                   th:classappend="${group.unassigned ? 'is-unassigned' : (group.fillState == 'is-full' ? 'is-full' : (group.fillState == 'is-low' ? 'is-low' : (group.vehicleCount == 0 ? 'is-empty' : 'is-open')))}">
                    <span class="place-photo is-sale">
                        <img th:src="@{/images/hub/sale.png(v=20261017a)}" alt="">
                    </span>
                    <span class="place-body">
                        <span class="place-card-top">
                            <span class="place-code" th:text="${group.unassigned ? 'Unassigned' : group.saleCode}">SL-01</span>
                            <em class="pill gold" th:if="${group.unassigned}">Unassigned</em>
                            <em class="pill rust" th:if="${!group.unassigned and group.fillState == 'is-full'}">Full</em>
                            <em class="pill gold" th:if="${!group.unassigned and group.fillState == 'is-low'}">Low</em>
                            <em class="pill leaf" th:if="${!group.unassigned and group.vehicleCount == 0}">Empty</em>
                            <em class="pill sea" th:if="${!group.unassigned and group.vehicleCount > 0 and group.fillState != 'is-full' and group.fillState != 'is-low'}">Available</em>
                        </span>
                        <strong class="place-title" th:text="${group.title}">Showroom</strong>
                        <span class="place-location">
                            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                            <span th:text="${group.location != null and !#strings.isEmpty(group.location) ? group.location : '—'}">Front showroom</span>
                        </span>
                        <span class="place-foot">
                            <span class="place-count">
                                <b th:text="${group.vehicleCount}">0</b>
                                <span th:text="${group.vehicleCount == 1} ? 'vehicle' : 'vehicles'">vehicles</span>
                            </span>
                            <span class="place-meter" th:if="${group.capacity != null}">
                                <span class="place-meter-label"><b th:text="${group.remaining}">14</b> left of <b th:text="${group.capacity}">15</b></span>
                                <span class="place-meter-track" role="progressbar"
                                      th:attr="aria-valuenow=${group.fillPercent}, aria-valuemin=0, aria-valuemax=100, aria-label=|${group.occupied} of ${group.capacity} spaces used|">
                                    <span class="place-meter-fill" th:style="|width: ${group.fillPercent}%|"></span>
                                </span>
                            </span>
                        </span>
                    </span>
                </a>
            </section>
            <article class="panel" th:if="${groups == null or groups.isEmpty()}">
                <p class="muted">No sale locations yet. Add them in Configuration, then move vehicles from the yard.</p>
            </article>
        </main>
    </div>
</div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
</body>
</html>
