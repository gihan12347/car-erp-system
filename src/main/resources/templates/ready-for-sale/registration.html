<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body class="sheet-page import-form-page">
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1 th:text="${'Step ' + @pipelineStageService.displayNumber('READY', 'registration') + ' · ' + @pipelineStageService.title('READY', 'registration')}">Step 3 · Registration</h1>
                    <p class="form-lead">Enter the local plate number, owner, and RMV date. This step is complete when the plate and date are saved.</p>
                </div>
                <div th:replace="shared/pipeline-delete :: pipelineDeleteBtn(
                        @{/ready-for-sale/{c}/delete(c=${vehicle.chassisNo})},
                        'Delete this sale listing?')"></div>
            </div>

            <div th:replace="ready-for-sale/fragments/pipeline :: salePipelineSteps(
                    'registration',
                    ${vehicle.chassisNo},
                    ${listingReady},
                    ${vehicle.model},
                    false,
                    ${detailsReady},
                    ${registrationReady})"></div>

            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>
            <p th:if="${notice}" class="alert alert-warn" th:text="${notice}"></p>

            <form th:action="@{/registration/{chassisNo}(chassisNo=${vehicle.chassisNo})}"
                  th:object="${record}" method="post" class="vehicle-form prep-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="hub" th:value="${hubMode}">
                <input type="hidden" th:field="*{chassisNo}">

                <article class="panel">
                    <div class="panel-head"><h2>Local registration</h2></div>
                    <div class="field-grid">
                        <label>Registration no.
                            <input type="text" th:field="*{registrationNo}" placeholder="e.g. CAA-1234">
                        </label>
                        <label>Registered date
                            <input type="date" th:field="*{registeredDate}">
                        </label>
                        <label>Registered owner
                            <input type="text" th:field="*{registeredOwner}">
                        </label>
                        <label>RMV office
                            <input type="text" th:field="*{rmvOffice}">
                        </label>
                        <label>File no.
                            <input type="text" th:field="*{fileNo}">
                        </label>
                    </div>
                </article>

                <article class="panel">
                    <div class="panel-head"><h2>License &amp; insurance</h2></div>
                    <div class="field-grid">
                        <label>Revenue license no.
                            <input type="text" th:field="*{revenueLicenseNo}">
                        </label>
                        <label>Revenue license expiry
                            <input type="date" th:field="*{revenueLicenseExpiry}">
                        </label>
                        <label>Insurance company
                            <input type="text" th:field="*{insuranceCompany}">
                        </label>
                        <label>Policy no.
                            <input type="text" th:field="*{insurancePolicyNo}">
                        </label>
                        <label>Insurance expiry
                            <input type="date" th:field="*{insuranceExpiry}">
                        </label>
                    </div>
                </article>

                <article class="panel">
                    <div class="panel-head"><h2>Notes</h2></div>
                    <div class="field-grid">
                        <label class="span-2">Internal notes
                            <textarea th:field="*{notes}" rows="3"></textarea>
                        </label>
                    </div>
                </article>

                <div class="import-view-actions">
                    <th:block th:replace="preparation-pipeline/fragments/form-actions :: prepFormActions('Save registration', null)"></th:block>
                </div>
            </form>
        </main>
    </div>
</div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
</body>
</html>
