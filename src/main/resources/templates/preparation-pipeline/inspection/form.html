<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body class="sheet-page import-form-page">
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1 th:text="${'Step ' + @pipelineStageService.displayNumber('PREP', 'inspection') + ' · ' + @pipelineStageService.title('PREP', 'inspection')}">Step 1 · Inspection</h1>
                    <p class="form-lead">Fill every item. Selecting <strong>No</strong> creates a workshop job immediately. Save stays off until all fields are filled.</p>
                </div>
            </div>

            <div th:replace="preparation-pipeline/fragments/pipeline :: prepPipelineSteps(
                    'inspection',
                    ${vehicle.chassisNo},
                    ${workshopReady},
                    ${yardReady},
                    ${inspectionReady},
                    ${canEnterYard},
                    ${vehicle.model},
                    false)"></div>

            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>

            <div th:replace="preparation-pipeline/inspection/form-fields :: inspectionForm"></div>
        </main>
    </div>
</div>

<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
<script th:src="@{/js/preparation-pipeline/inspection.js(v=20260908c)}"></script>
</body>
</html>
