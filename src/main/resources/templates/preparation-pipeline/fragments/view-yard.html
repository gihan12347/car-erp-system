<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="yardView(vehicle, yard, yardReady)" class="import-view-stage">
    <div class="panel import-view-empty" th:if="${yard == null}">
        <i class="fa-solid fa-warehouse"></i>
        <strong>No yard record yet</strong>
        <p>Select a date and an available yard. Saving a yard uses one space from that yard’s capacity.</p>
        <div class="import-view-actions">
            <a th:if="${stageNav != null and stageNav.prevUrl != null}"
               th:href="${stageNav.prevUrl}"
               class="panel-btn ghost import-form-submit">
                <i class="fa-solid fa-chevron-left"></i>
                Previous
            </a>
            <a th:href="@{/yard/{c}(c=${vehicle.chassisNo}, hub=1)}" class="panel-btn import-form-submit">Start yard record</a>
            <a th:if="${stageNav != null and stageNav.nextUrl != null}"
               th:href="${stageNav.nextUrl}"
               class="panel-btn ghost import-form-submit">
                <span th:text="${stageNav.nextLabel}">Next · Sale</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>

    <div th:if="${yard != null}">
        <article class="panel">
            <div class="panel-head"><h2>Yard assignment</h2></div>
            <div class="field-grid">
                <label>Date <input type="text" th:value="${yard.arrivalDate}" readonly class="readonly-field"></label>
                <label>Yard <input type="text" th:value="${yard.bayNo}" readonly class="readonly-field"></label>
                <label>Location <input type="text" th:value="${yard.yardSection}" readonly class="readonly-field"></label>
            </div>
        </article>
        <div class="import-view-actions">
            <a th:if="${stageNav != null and stageNav.prevUrl != null}"
               th:href="${stageNav.prevUrl}"
               class="panel-btn ghost import-form-submit">
                <i class="fa-solid fa-chevron-left"></i>
                Previous
            </a>
            <a th:href="@{/yard/{c}(c=${vehicle.chassisNo}, hub=1)}" class="panel-btn ghost import-form-submit">Edit yard</a>
            <a th:if="${stageNav != null and stageNav.nextUrl != null}"
               th:href="${stageNav.nextUrl}"
               class="panel-btn import-form-submit">
                <span th:text="${stageNav.nextLabel}">Next · Sale</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</section>

</body>
</html>
