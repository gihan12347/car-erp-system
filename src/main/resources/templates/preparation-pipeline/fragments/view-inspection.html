<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="inspectionView(vehicle, inspection, inspectionReady)" class="import-view-stage">
    <div class="panel import-view-empty" th:if="${inspection == null}">
        <i class="fa-solid fa-clipboard-check"></i>
        <strong>No inspection record yet</strong>
        <p>Checklist items from Inspection items appear automatically. Mark each OK, No, or N/A.</p>
        <div class="import-view-actions">
            <a th:href="@{/inspection/{c}(c=${vehicle.chassisNo}, hub=1)}" class="panel-btn import-form-submit">Start inspection</a>
            <a th:if="${stageNav != null and stageNav.nextUrl != null}"
               th:href="${stageNav.nextUrl}"
               class="panel-btn ghost import-form-submit">
                <span th:text="${stageNav.nextLabel}">Next · Workshop</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>

    <div th:unless="${inspection == null}">
        <article class="panel">
            <div class="panel-head"><h2>Inspection details</h2></div>
            <div class="field-grid">
                <label>Inspector <input type="text" th:value="${inspection.inspector}" readonly class="readonly-field"></label>
                <label>Inspection date <input type="text" th:value="${inspection.inspectionDate}" readonly class="readonly-field"></label>
            </div>
        </article>

        <article class="panel inspection-item-card" th:each="line, stat : ${inspection.lines}">
            <div class="panel-head workshop-job-head">
                <h2>
                    <span th:text="${line.itemTitle}">Engine</span>
                    <em class="pill muted-pill"
                        th:text="${T(com.carsale.erp.preparationpipeline.inspection.InspectionResults).display(line.result)}">OK</em>
                </h2>
            </div>
            <div class="field-grid" th:if="${line.notes != null and !#strings.isEmpty(line.notes)}">
                <label class="span-2">Notes
                    <textarea th:text="${line.notes}" readonly class="readonly-field" rows="2"></textarea>
                </label>
            </div>
        </article>

        <div class="import-view-actions">
            <a th:if="${stageNav != null and stageNav.prevUrl != null}"
               th:href="${stageNav.prevUrl}"
               class="panel-btn ghost import-form-submit">
                <i class="fa-solid fa-chevron-left"></i>
                Previous
            </a>
            <a th:href="@{/inspection/{c}(c=${vehicle.chassisNo}, hub=1)}" class="panel-btn ghost import-form-submit">Edit inspection</a>
            <a th:if="${stageNav != null and stageNav.nextUrl != null}"
               th:href="${stageNav.nextUrl}"
               class="panel-btn import-form-submit">
                <span th:text="${stageNav.nextLabel}">Next · Workshop</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</section>

</body>
</html>
