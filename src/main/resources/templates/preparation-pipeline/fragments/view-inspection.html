<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="inspectionView(vehicle, inspection, inspectionReady)" class="import-view-stage">
    <div class="panel import-view-empty" th:if="${inspection == null}">
        <i class="fa-solid fa-clipboard-check"></i>
        <strong>No inspection record yet</strong>
        <p>Checklist items from Inspection items appear automatically. Mark each OK, No, or N/A.</p>
        <div class="import-view-actions">
            <a th:href="@{/inspection/{c}(c=${vehicle.chassisNo}, hub=1)}" class="panel-btn import-form-submit">Start inspection</a>
            <a th:if="${stageNav != null and stageNav.nextUrl != null}"
               th:href="${stageNav.nextUrl}"
               class="panel-btn ghost import-form-submit">
                <span th:text="${stageNav.nextLabel}">Next · Workshop</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>

    <div th:unless="${inspection == null}">
        <article class="panel inspection-details-panel">
            <div class="panel-head"><h2>Inspection details</h2></div>
            <div class="field-grid">
                <label>Inspector <input type="text" th:value="${inspection.inspector}" readonly class="readonly-field"></label>
                <label>Inspection date <input type="text" th:value="${inspection.inspectionDate}" readonly class="readonly-field"></label>
            </div>
        </article>

        <article class="panel inspection-checklist-panel">
            <div class="panel-head"><h2>Checklist</h2></div>
            <ul class="inspection-checklist">
                <li class="inspection-check-row"
                    th:each="line, stat : ${inspection.lines}"
                    th:with="resultKey=${T(com.carsale.erp.preparationpipeline.inspection.InspectionResults).cssClass(line.result)},
                             resultLabel=${T(com.carsale.erp.preparationpipeline.inspection.InspectionResults).display(line.result)}"
                    th:classappend="${' is-' + #strings.toLowerCase(resultKey)}">
                    <span class="inspection-check" th:title="${resultLabel}" th:aria-label="${resultLabel}">
                        <i class="fa-solid fa-check" th:if="${resultKey == 'OK'}" aria-hidden="true"></i>
                        <i class="fa-solid fa-xmark" th:if="${resultKey == 'NO'}" aria-hidden="true"></i>
                        <i class="fa-solid fa-minus" th:if="${resultKey == 'NA'}" aria-hidden="true"></i>
                    </span>
                    <div class="inspection-check-body">
                        <strong th:text="${line.itemTitle}">Engine</strong>
                        <p class="inspection-check-note"
                           th:if="${line.notes != null and !#strings.isEmpty(line.notes)}"
                           th:text="${line.notes}">Need to replace</p>
                    </div>
                </li>
            </ul>
        </article>

        <div class="import-view-actions">
            <a th:if="${stageNav != null and stageNav.prevUrl != null}"
               th:href="${stageNav.prevUrl}"
               class="panel-btn ghost import-form-submit">
                <i class="fa-solid fa-chevron-left"></i>
                Previous
            </a>
            <a th:href="@{/inspection/{c}(c=${vehicle.chassisNo}, hub=1)}" class="panel-btn ghost import-form-submit">Edit inspection</a>
            <a th:if="${stageNav != null and stageNav.nextUrl != null}"
               th:href="${stageNav.nextUrl}"
               class="panel-btn import-form-submit">
                <span th:text="${stageNav.nextLabel}">Next · Workshop</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</section>

</body>
</html>
