<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body class="prep-page">
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1 th:text="${'Step ' + @pipelineStageService.displayNumber('PREP', 'yard') + ' · Yard'}">Step 2 · Yard</h1>
                    <p class="form-lead">Assign a bay, record keys, and complete the yard inspection. Mark complete when the vehicle is in place.</p>
                </div>
            </div>

            <div th:replace="preparation-pipeline/fragments/pipeline :: prepPipelineSteps(
                    'yard',
                    ${vehicle.chassisNo},
                    ${workshopReady},
                    ${yardReady},
                    ${inspectionReady},
                    ${canEnterYard},
                    ${vehicle.model},
                    false)"></div>

            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>

            <form th:action="@{/yard/{chassisNo}(chassisNo=${vehicle.chassisNo})}"
                  th:object="${record}" method="post" class="vehicle-form prep-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{chassisNo}">

                <label class="complete-check panel">
                    <input type="checkbox" th:field="*{completed}">
                    <span>
                        <strong>Mark yard complete</strong>
                        <small>Bay allocated. The vehicle can move to the ready for sale pipeline when workshop is also complete.</small>
                    </span>
                </label>

                <article class="panel">
                    <div class="panel-head"><h2>Location</h2></div>
                    <div class="field-grid">
                        <label>Bay no. <input type="text" th:field="*{bayNo}" placeholder="A-12"></label>
                        <label>Yard section <input type="text" th:field="*{yardSection}" placeholder="Front row / indoor"></label>
                        <label>Arrival date <input type="text" th:field="*{arrivalDate}" placeholder="2026-08-22"></label>
                        <label>Keys location <input type="text" th:field="*{keysLocation}" placeholder="Office key board 4"></label>
                    </div>
                </article>

                <article class="panel">
                    <div class="panel-head"><h2>Inspection</h2></div>
                    <div class="field-grid">
                        <label>Status
                            <select th:field="*{inspectionStatus}">
                                <option value="PENDING">Pending</option>
                                <option value="PASSED">Passed</option>
                                <option value="FAILED">Failed</option>
                            </select>
                        </label>
                        <label>Inspector <input type="text" th:field="*{inspector}"></label>
                        <label>Inspection date <input type="text" th:field="*{inspectionDate}"></label>
                        <label class="span-2">Condition notes
                            <textarea th:field="*{conditionNotes}" rows="3"></textarea>
                        </label>
                        <label class="span-2">Notes
                            <textarea th:field="*{notes}" rows="3"></textarea>
                        </label>
                    </div>
                </article>

                <div class="import-view-actions">
                    <a th:if="${stageNav != null and stageNav.prevUrl != null}"
                       th:href="${stageNav.prevUrl}"
                       class="panel-btn ghost import-form-submit">
                        <i class="fa-solid fa-chevron-left"></i>
                        Previous · Workshop
                    </a>
                    <button type="submit" class="panel-btn import-form-submit">Save yard record</button>
                    <a th:if="${stageNav != null and stageNav.nextUrl != null}"
                       th:href="${stageNav.nextUrl}"
                       class="panel-btn ghost import-form-submit">
                        <span th:text="${stageNav.nextLabel}">Next · Ready for sale pipeline</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </a>
                </div>
            </form>
        </main>
    </div>
</div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
</body>
</html>
