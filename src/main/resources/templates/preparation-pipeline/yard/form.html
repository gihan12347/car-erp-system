<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="shared/head :: head(${pageTitle})"></head>
<body class="sheet-page import-form-page">
<div class="app-shell">
    <aside th:replace="shared/sidebar :: sidebar(${activeMenu})"></aside>
    <div class="app-main">
        <header th:replace="shared/topbar :: topbar"></header>
        <main class="page-content">
            <div class="dash-head">
                <div>
                    <h1 th:text="${'Step ' + @pipelineStageService.displayNumber('PREP', 'yard') + ' · ' + @pipelineStageService.title('PREP', 'yard')}">Step 3 · Yard</h1>
                    <p class="form-lead">Pick the arrival date and an available yard. Saving a yard uses one space from that yard’s capacity.</p>
                </div>
            </div>

            <div th:replace="preparation-pipeline/fragments/pipeline :: prepPipelineSteps(
                    'yard',
                    ${vehicle.chassisNo},
                    ${workshopReady},
                    ${yardReady},
                    ${inspectionReady},
                    ${canEnterYard},
                    ${vehicle.model},
                    false,
                    ${saleReady})"></div>

            <p th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>

            <form th:action="@{/yard/{chassisNo}(chassisNo=${vehicle.chassisNo})}"
                  th:object="${record}" method="post" class="vehicle-form prep-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="hub" th:value="${hubMode}">
                <input type="hidden" th:field="*{chassisNo}">
                <input type="hidden" th:field="*{yardSection}" id="yardSectionValue">

                <article class="panel">
                    <div class="panel-head"><h2>Yard assignment</h2></div>
                    <div class="field-grid">
                        <label>Date
                            <input type="date" th:field="*{arrivalDate}" required>
                        </label>
                        <label>Available yard
                            <select th:field="*{bayNo}" id="yardBaySelect"
                                    th:attr="data-current=*{bayNo}">
                                <option value="">Select yard…</option>
                                <option th:each="bay : ${yardBays}"
                                        th:value="${bay.bayCode}"
                                        th:text="${bay.full and (record.bayNo == null or not #strings.equalsIgnoreCase(record.bayNo, bay.bayCode))
                                                ? bay.bayCode + ' · ' + bay.yardName + ' · full'
                                                : bay.bayCode + ' · ' + bay.yardName + ' · ' + bay.remaining + ' left'}"
                                        th:disabled="${bay.full and (record.bayNo == null or not #strings.equalsIgnoreCase(record.bayNo, bay.bayCode))}"
                                        th:attr="data-location=${bay.location},
                                                 data-remaining=${bay.remaining},
                                                 data-capacity=${bay.capacity},
                                                 data-occupied=${bay.occupied},
                                                 data-name=${bay.yardName}">YD-01 · Main yard · 12 left</option>
                            </select>
                        </label>
                        <label>Location
                            <input type="text" id="yardLocationDisplay" readonly class="readonly-field"
                                   th:value="${record.yardSection}">
                        </label>
                        <p class="yard-capacity-hint span-2" id="yardCapacityHint" hidden></p>
                    </div>
                </article>

                <div class="import-view-actions">
                    <th:block th:replace="preparation-pipeline/fragments/form-actions :: prepFormActions('Save & continue', null)"></th:block>
                </div>
            </form>
        </main>
    </div>
</div>
<script th:src="@{/js/shared/app.js(v=20260905k)}"></script>
<script th:src="@{/js/shared/capacity-select.js(v=20260919a)}"></script>
<script>
    window.bindCapacitySelect({
        selectId: "yardBaySelect",
        displayId: "yardLocationDisplay",
        valueId: "yardSectionValue",
        hintId: "yardCapacityHint"
    });
</script>
</body>
</html>
