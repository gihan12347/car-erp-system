<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <style>
    .tag { transform-origin: 62px 32px; animation: swing 2.8s ease-in-out infinite; }
    .wheel { transform-origin: center; transform-box: fill-box; animation: spin 2.4s linear infinite; }
    .shine { animation: gleam 2.6s ease-in-out infinite; }
    @keyframes swing { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes gleam { 50% { opacity: 0.35; } }
  </style>
  <rect width="96" height="96" rx="24" fill="#FFEDD5"/>
  <ellipse cx="48" cy="80" rx="26" ry="4" fill="#FDBA74" opacity="0.45"/>
  <path d="M16 60c1-6 6-11 13-13l8-10c2-3 5-4 9-4h11c4 0 8 2 10 5l6 8c6 2 10 7 11 12v6c0 3-2 5-5 5H21c-3 0-5-2-5-5v-4z" fill="#C2410C"/>
  <path class="shine" d="M34 35h12l3 11H32l2-11z" fill="#FFF7ED" opacity="0.75"/>
  <g class="wheel"><circle cx="32" cy="72" r="7" fill="#1C1917"/><circle cx="32" cy="72" r="3.5" fill="#E7E5E4"/></g>
  <g class="wheel"><circle cx="64" cy="72" r="7" fill="#1C1917"/><circle cx="64" cy="72" r="3.5" fill="#E7E5E4"/></g>
  <g class="tag">
    <path d="M58 18l16 9-9 15-16-9 9-15z" fill="#10B981"/>
    <circle cx="70" cy="28" r="2.5" fill="#ECFDF5"/>
  </g>
