<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="gradeView(vehicle, certificate, gradeReady)"
         class="import-view-stage clearance-form"
         th:with="docUrl=${certificate != null and certificate.documentStoredName != null ? '/grade/documents/' + certificate.documentStoredName : null},
                  hasDoc=${certificate != null and certificate.documentStoredName != null and !#strings.isEmpty(certificate.documentStoredName)}">

    <div class="panel import-view-empty" th:if="${certificate == null or !hasDoc}">
        <i class="fa-solid fa-magnifying-glass"></i>
        <strong>Grade search not uploaded yet</strong>
        <p>Upload the grade search document to view the extracted grade.</p>
        <div class="import-view-actions">
            <a th:if="${stageNav != null and stageNav.prevUrl != null}"
               th:href="${stageNav.prevUrl}"
               class="panel-btn ghost import-form-submit">
                <i class="fa-solid fa-chevron-left"></i>
                Previous
            </a>
            <a th:href="@{/grade/{c}(c=${vehicle.chassisNo})}" class="panel-btn import-form-submit">Upload grade search</a>
            <a th:if="${stageNav != null and stageNav.nextUrl != null}"
               th:href="${stageNav.nextUrl}"
               class="panel-btn ghost import-form-submit">
                <span th:text="${stageNav.nextLabel}">Next · Vehicle images</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>

    <th:block th:if="${certificate != null and hasDoc}">
        <div class="sheet-layout">
            <div class="sheet-document-col">
            <aside class="panel sheet-document has-file">
                <div class="panel-head"><h2>Document preview</h2></div>
                <div class="sheet-preview-frame">
                    <img th:if="${!(certificate.documentContentType != null and #strings.contains(certificate.documentContentType, 'pdf')) and !(certificate.documentStoredName != null and #strings.endsWith(certificate.documentStoredName, '.pdf'))}"
                         th:src="@{/grade/documents/{name}(name=${certificate.documentStoredName})}"
                         alt="Grade search preview">
                    <iframe th:if="${(certificate.documentContentType != null and #strings.contains(certificate.documentContentType, 'pdf')) or (certificate.documentStoredName != null and #strings.endsWith(certificate.documentStoredName, '.pdf'))}"
                            th:src="@{/grade/documents/{name}(name=${certificate.documentStoredName})}"
                            title="Grade search PDF"></iframe>
                </div>
            </aside>

            <div th:replace="shared/document-view-toolbar :: documentViewToolbar(
                    'Grade search',
                    ${certificate.documentOriginalName},
                    ${docUrl},
                    ${stageNav != null ? stageNav.editUrl : null})"></div>
            </div>

            <div class="sheet-fields preship-fields">
                <article class="panel">
                    <div class="panel-head"><h2>Grade search</h2></div>
                    <div class="field-grid">
                        <label>Grade <input type="text" th:value="${certificate.grade}" readonly class="readonly-field"></label>
                    </div>
                </article>
            </div>
        </div>
        <div class="import-view-actions">
            <a th:if="${stageNav != null and stageNav.prevUrl != null}"
               th:href="${stageNav.prevUrl}"
               class="panel-btn ghost import-form-submit">
                <i class="fa-solid fa-chevron-left"></i>
                Previous
            </a>
            <a th:href="@{/grade/{c}(c=${vehicle.chassisNo})}" class="panel-btn ghost import-form-submit">Edit grade search</a>
            <a th:if="${stageNav != null and stageNav.nextUrl != null}"
               th:href="${stageNav.nextUrl}"
               class="panel-btn import-form-submit">
                <span th:text="${stageNav.nextLabel}">Next · Vehicle images</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </th:block>
</section>

</body>
</html>
